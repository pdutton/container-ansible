name: build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Cancel superseded pull-request runs, but let a master push finish -- a
# cancellation mid-push would leave a variant's tag set half-updated in the
# registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      # One variant's failure must not stop the other three from publishing.
      # alpine-development resolves whatever 14.x pip serves that day and is
      # the most exposed to upstream change.
      fail-fast: false
      matrix:
        variant:
          - alpine-stable
          - alpine-development
          - ubuntu-stable
          - ubuntu-development

    steps:
      # v7 runs on Node.js 24. v4 targets Node.js 20, which is deprecated, and
      # the runner forces it onto 24 anyway while emitting a warning on every
      # job.
      - uses: actions/checkout@v7

      # Default checkout depth is fine: the Makefile's `git rev-parse HEAD`
      # works at depth 1.

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          # Resolve the tools from PATH and hand the results to make, rather
          # than asserting they sit at the Makefile's default absolute paths.
          #
          # This step used to run `test -x /usr/bin/podman`. That broke on
          # 2026-08-13, when the ubuntu-24.04 runner image moved podman off
          # /usr/bin as it went from 4.9.3 to 5.8.4 (image release
          # 20260810.271). During the rollout, jobs landed on either image, so
          # the same commit passed or failed depending on which runner it drew
          # -- and it would have failed every time once the rollout finished.
          #
          # The absolute path was never load-bearing: the Makefile takes PODMAN
          # and AWK as overridable variables precisely so a caller can say where
          # its tools are. CI is such a caller, and now says so.
          PODMAN="$(command -v podman)"
          AWK="$(command -v awk)"
          test -n "$PODMAN" || { echo "ERROR: podman not on PATH after install" >&2; exit 1; }
          test -n "$AWK"    || { echo "ERROR: awk not on PATH" >&2; exit 1; }
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          echo "AWK=$AWK"       >> "$GITHUB_ENV"
          echo "Using podman at $PODMAN, awk at $AWK"
          "$PODMAN" --version

      # Publishing happens only from master. A dispatch against another branch
      # still builds and smoke-tests, so a branch can be put through CI, but it
      # must never overwrite the shared mutable tags (latest, alpine, ubuntu,
      # <os>-<major>) with unreviewed code. This condition is the exact negation
      # of the publish condition below -- if it were merely the pull_request
      # check, a dispatch from a feature branch would match no step at all and
      # the job would silently do nothing.
      - name: Build and smoke-test
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        run: make PODMAN="$PODMAN" AWK="$AWK" test-${{ matrix.variant }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | podman login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      # One invocation, not two: push-<variant> depends on test-<variant> which
      # depends on build-<variant>, so this builds, smoke-tests, and publishes.
      # Running `make test-` in a separate step first would repeat the whole
      # chain -- these pattern targets match no real file, so Make re-runs them
      # on every invocation.
      - name: Build, smoke-test, and push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: make PODMAN="$PODMAN" AWK="$AWK" push-${{ matrix.variant }}

  # Docker Hub does not read anything from this repo on its own, so the overview
  # page would otherwise drift from DOCKERHUB-OVERVIEW.md the moment either
  # is edited alone. Same master-only guard as the publish steps above: the page
  # is shared by every consumer and a branch build must not rewrite it.
  #
  # Separate job rather than a fifth step, because the build job is a matrix of
  # four variants and this must run exactly once. `needs: build` waits for all
  # four legs, so a broken build leaves the old page in place rather than
  # advertising images that were never published.
  description:
    name: dockerhub-description
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v7

      # The short description is set here too, so the whole Hub page is
      # declarative -- leaving it unset would silently preserve whatever was
      # last typed into the web UI.
      # Pinned by SHA, not by tag: this is the only third-party action here and
      # it is handed a Docker Hub token with write/delete scope. A tag is a
      # mutable pointer in someone else's repository -- repointing v5 would run
      # new code against that secret with no change on this side. actions/checkout
      # stays on a major tag; it is inside GitHub's own trust boundary.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pdutton/ansible
          readme-filepath: ./DOCKERHUB-OVERVIEW.md
          short-description: "Ansible on Alpine or Ubuntu, ready to run without installing it"
