---
- name: Smoke-test the ansible container image
  hosts: localhost
  gather_facts: false
  vars:
    expect_major: ""
    expect_winrm: "false"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: Require expect_major to be supplied
      ansible.builtin.assert:
        that:
          - expect_major | length > 0
        fail_msg: "Run with -e expect_major=<N>"

    - name: Read the Ansible community bundle version
      ansible.builtin.command: ansible-community --version
      register: community_version
      changed_when: false

    - name: Assert the bundle major matches the channel
      ansible.builtin.assert:
        that:
          - community_version.stdout.split()[-1].split('.')[0] == expect_major
        fail_msg: >-
          Expected Ansible major {{ expect_major }}, got
          '{{ community_version.stdout }}'. The distro may have changed
          which version this channel resolves to.
        success_msg: "Ansible bundle {{ community_version.stdout.split()[-1] }}"

    - name: Assert json_query works (requires jmespath)
      ansible.builtin.assert:
        that:
          - >-
            [{'n': 'a'}, {'n': 'b'}] | community.general.json_query('[].n')
            == ['a', 'b']
        fail_msg: "json_query failed - jmespath is missing"

    - name: Assert password_hash works (requires passlib)
      ansible.builtin.assert:
        that:
          - "'x' | password_hash('sha512', 'abcdefghijklmnop') is match('^\\$6\\$')"
        fail_msg: "password_hash failed - passlib is missing"

    - name: Check Windows/Kerberos/SELinux capability (winrm, gssapi, selinux)
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - "import winrm, gssapi, selinux"
      register: winrm_capability
      changed_when: false
      failed_when: false
      when: expect_winrm == "true"

    - name: Assert winrm/gssapi/selinux are importable
      ansible.builtin.assert:
        that:
          - winrm_capability.rc == 0
        fail_msg: >-
          expect_winrm=true but winrm/gssapi/selinux failed to import under
          {{ ansible_playbook_python }}: {{ winrm_capability.stderr }}
        success_msg: "winrm/gssapi/selinux import OK"
      when: expect_winrm == "true"

    # Asks the psrp connection plugin itself whether it found pypsrp, rather
    # than just importing pypsrp, so a plugin-side import change is caught too.
    - name: Check PSRP capability (pypsrp, requests-credssp)
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import requests_credssp;
            from ansible.plugins.connection import psrp;
            assert psrp.HAS_PYPSRP, psrp.PYPSRP_IMP_ERR
      register: psrp_capability
      changed_when: false
      failed_when: false

    - name: Assert the psrp connection plugin has pypsrp and credssp
      ansible.builtin.assert:
        that:
          - psrp_capability.rc == 0
        fail_msg: >-
          pypsrp/requests-credssp not usable by the psrp connection plugin
          under {{ ansible_playbook_python }}: {{ psrp_capability.stderr }}
        success_msg: "psrp connection plugin OK"

    # pyspnego (PSRP's auth layer) silently falls back to NTLM-only when its
    # Kerberos backend fails to import, so importing gssapi alone proves
    # nothing -- it also needs krb5. HAS_GSSAPI is pyspnego's own verdict.
    - name: Check Kerberos over PSRP (pyspnego gssapi+krb5 backend, kinit)
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import shutil, spnego._gss as g;
            assert g.HAS_GSSAPI, g.GSSAPI_IMP_ERR;
            assert shutil.which("kinit"), "kinit not on PATH"
      register: psrp_kerberos
      changed_when: false
      failed_when: false
      when: expect_winrm == "true"

    - name: Assert pyspnego can do Kerberos and kinit is present
      ansible.builtin.assert:
        that:
          - psrp_kerberos.rc == 0
        fail_msg: >-
          expect_winrm=true but Kerberos over PSRP is unavailable under
          {{ ansible_playbook_python }}: {{ psrp_kerberos.stderr }}
        success_msg: "PSRP Kerberos backend and kinit OK"
      when: expect_winrm == "true"

    - name: Locate the ssh client
      ansible.builtin.command: which ssh
      register: ssh_path
      changed_when: false
      failed_when: ssh_path.rc != 0

    - name: Create a directory
      ansible.builtin.file:
        path: /tmp/smoke
        state: directory
        mode: "0755"

    - name: Copy content into it
      ansible.builtin.copy:
        content: "ok\n"
        dest: /tmp/smoke/result.txt
        mode: "0644"

    - name: Read it back
      ansible.builtin.slurp:
        src: /tmp/smoke/result.txt
      register: readback

    - name: Assert the file round-tripped
      ansible.builtin.assert:
        that:
          - (readback.content | b64decode) == "ok\n"
        fail_msg: "copy/slurp round-trip failed"

    # The bundled pdutton.xplat collection: a filter proves it is on the
    # collections path at all, and an action plugin proves its dispatch to the
    # underlying module works (no facts gathered, so it picks ansible.builtin).
    - name: Assert the pdutton.xplat basename filter handles a Windows path
      ansible.builtin.assert:
        that:
          - "'C:\\Windows\\System32\\cmd.exe' | pdutton.xplat.basename == 'cmd.exe'"
        fail_msg: "pdutton.xplat.basename failed - is the collection installed?"

    - name: Stat the round-tripped file through pdutton.xplat
      pdutton.xplat.stat:
        path: /tmp/smoke/result.txt
      register: xplat_stat

    - name: Assert pdutton.xplat.stat found the file
      ansible.builtin.assert:
        that:
          - xplat_stat.stat.exists
        fail_msg: "pdutton.xplat.stat did not report /tmp/smoke/result.txt: {{ xplat_stat }}"
